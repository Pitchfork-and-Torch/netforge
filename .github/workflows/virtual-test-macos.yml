name: Virtual test (macos)

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/virtual-test-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/virtual-test-macos.yml'

jobs:
  virtual-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Run virtual test
        run: bash tests/virtual-test.sh
